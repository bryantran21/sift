name: ingest

# Runs the ingest worker on a schedule. Times are UTC; GitHub may delay scheduled
# runs by 5–15 min under load, which is fine for a "within hours" job radar.
# Scheduled workflows are auto-disabled after 60 days of no repo activity.
on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {} # manual "Run workflow" button

# Never let two ingests overlap.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ingest
        run: pnpm ingest
        env:
          # Add this in the repo: Settings → Secrets and variables → Actions.
          # Use Supabase's POOLER connection string (IPv4); the direct one is IPv6-only.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
